<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Барбершоп «Бритва» — запись</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <header class="header">
    <div class="header__inner">
      <div class="logo">
        <span class="logo__icon">💈</span>
        <span class="logo__text">Бритва</span>
      </div>
      <nav class="nav">
        <a href="#" class="nav__link">Услуги</a>
        <a href="#" class="nav__link">Мастера</a>
        <a href="#" class="nav__link nav__link--active">Запись</a>
      </nav>
    </div>
  </header>

  <main class="main">
    <h1 class="title">Запись к мастеру</h1>

    <section class="masters">
      <h2 class="section-title">Выберите мастера</h2>
      <div class="masters__list" id="masters-list"></div>
    </section>

    <section class="calendar">
      <h2 class="section-title">Выберите дату</h2>
      <div class="calendar__header">
        <button class="calendar__arrow" type="button" id="prev-month" aria-label="Предыдущий месяц">‹</button>
        <span class="calendar__month" id="current-month"></span>
        <button class="calendar__arrow" type="button" id="next-month" aria-label="Следующий месяц">›</button>
      </div>
      <div class="calendar__weekdays">
        <span class="calendar__weekday">Пн</span>
        <span class="calendar__weekday">Вт</span>
        <span class="calendar__weekday">Ср</span>
        <span class="calendar__weekday">Чт</span>
        <span class="calendar__weekday">Пт</span>
        <span class="calendar__weekday">Сб</span>
        <span class="calendar__weekday">Вс</span>
      </div>
      <div class="calendar__grid" id="calendar-grid"></div>
    </section>

    <section class="slots">
      <h2 class="section-title">Выберите время</h2>
      <div class="slots__list" id="slots-list"></div>
    </section>

    <button class="submit-btn" type="button" id="submit-btn">Записаться</button>
  </main>

  <footer class="footer">
    <p class="footer__text">© 2026 Барбершоп «Бритва». Все права защищены.</p>
  </footer>

  <script src="script.js"></script>
</body>
</html>
